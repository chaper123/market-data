name: intraday-snapshot

# 2026-11-03 停用：證交所 MIS（基本市況報導網站）的使用條款禁止未經同意以程式下載，盤中價改由網站在使用者
# 自己的瀏覽器查（富果，不轉發）。保留手動觸發但什麼都不做，讓 cron-job.org 暫停前的觸發不會失敗、寄錯誤通知；
# data/tw/intraday.json 保留到停用前的內容，不再更新。intraday.py 程式留著（取得證交所同意後可恢復）。
on:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Disabled
        run: echo "intraday-snapshot 已於 2026-11-03 停用（見 workflow 開頭說明），不抓資料、不推送"
