name: intraday-snapshot

# 證交所 MIS 盤中快照（intraday.py → data/tw/intraday.json），給台股晨報取代鉅亨網盤中價。
# 只由 cron-job.org（約台北 10:05）或手動觸發，不排程。不動 meta.json，也不影響 fetch.yml 的略過判斷。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: intraday-snapshot
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Snapshot
        run: python intraday.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetch、news、intraday 三個 workflow 都會推送：publish.py 每次從最新的 main 重新套用
          # 自己的檔案與自己負責的 meta 資料集，被拒就重來，不會衝突或蓋掉別人的更新
          python publish.py --message "intraday $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')" --paths data/tw/intraday.json
