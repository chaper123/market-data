name: fetch-market-data

on:
  schedule:
    # GitHub 的 cron 用 UTC，常延遲、偶爾整個漏跑，所以排多個時間。
    # 第一次成功後，同一天（台北）其餘幾次會直接略過。
    # 台北 05:13 起美股已收盤、台股前一交易日也已收盤，數據就是完整的。
    # 週六也跑（2026-11-07 加，備援）：週五收盤平常由 cron-job.org 週五美東 17:15（台北週六 06:15）抓，
    # 那次失敗時不用等到週一。週一早上的檢查看到最後日期已經是週五，會直接略過。
    - cron: "13 21 * * 0-5"  # 台北 05:13（週一～六）
    - cron: "37 22 * * 0-5"  # 台北 06:37
    - cron: "53 23 * * 0-5"  # 台北 07:53
    - cron: "41 0 * * 1-6"   # 台北 08:41
    - cron: "47 1 * * 1-6"   # 台北 09:47
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python fetch.py --skip-if-fresh
          else
            python fetch.py
          fi

      - name: Technical radar
        run: |
          python radar.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetch、news、intraday、longterm 四個 workflow 都會推送：publish.py 每次從最新的 main 重新套用
          # 自己的檔案與自己負責的 meta 資料集，被拒就重來，不會衝突或蓋掉別人的更新
          python publish.py --message "data $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')" --paths data --exclude data/news data/tw/intraday.json data/longterm --meta-all --keep news/ longterm/
