name: fetch-market-data

on:
  schedule:
    # GitHub 的 cron 用 UTC，常延遲、偶爾整個漏跑，所以排多個時間。
    # 第一次成功後，同一天（台北）其餘幾次會直接略過。
    # 台北 05:13 起美股已收盤、台股前一交易日也已收盤，數據就是完整的。
    - cron: "13 21 * * 0-4"  # 台北 05:13（週一～五）
    - cron: "37 22 * * 0-4"  # 台北 06:37
    - cron: "53 23 * * 0-4"  # 台北 07:53
    - cron: "41 0 * * 1-5"   # 台北 08:41
    - cron: "47 1 * * 1-5"   # 台北 09:47
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: fetch-market-data
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Fetch data
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            python fetch.py --skip-if-fresh
          else
            python fetch.py
          fi

      - name: Technical radar
        run: |
          python radar.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --cached --quiet; then
            echo "no changes"
            exit 0
          fi
          git commit -m "data $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')"
          # news.yml、intraday.yml 也會 push（各自只改自己的檔案），先 rebase 再推，衝突時重試
          for i in 1 2 3; do
            git pull --rebase -q origin main && git push && exit 0
            sleep $((i * 5))
          done
          exit 1
