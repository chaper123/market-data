name: news-headlines

# 新聞三層架構的第一層：整理 Google News RSS 與 Fed 新聞稿標題（news.py → data/news/）。
# 只由 cron-job.org（約台北 08:20）或手動觸發，不排程。meta.json 只更新 news/*，不影響 fetch.yml 的略過判斷。
on:
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: news-headlines
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Headlines
        run: python news.py

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # fetch、news、intraday、longterm 四個 workflow 都會推送：publish.py 每次從最新的 main 重新套用
          # 自己的檔案與自己負責的 meta 資料集，被拒就重來，不會衝突或蓋掉別人的更新
          python publish.py --message "news $(TZ=Asia/Taipei date +'%Y-%m-%d %H:%M')" --paths data/news --meta-own news/
